name: App CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

jobs:
  # ── Lint and type-check ────────────────────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy --strict src/

  # ── Unit tests (no Docker) ─────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install dependencies
        working-directory: app
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest app/tests/unit -v

  # ── Integration tests (Postgres + LocalStack service containers) ────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # LocalStack is available for Secrets Manager integration testing.
      # Integration tests currently mock boto3 directly; LocalStack is here
      # for future test suites that exercise the real AWS SDK path.
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: secretsmanager

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install dependencies
        working-directory: app
        run: pip install -e ".[dev]"

      - name: Run integration tests
        env:
          # Picked up by conftest.py to bypass testcontainers and use this URL.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: pytest app/tests/integration -v

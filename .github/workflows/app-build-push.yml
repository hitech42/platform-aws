name: App - Build & Push

# Triggered on every push to develop or staging that touches application code,
# and manually for ad-hoc image builds.  Produces a commit-SHA-tagged ECR image
# consumed by the deploy workflow.
#
# Branch → environment mapping:
#   develop  →  GitHub env "dev",     ECR repo "cvs-platform"
#   staging  →  GitHub env "staging", ECR repo "cvs-platform-staging"
on:
  push:
    branches: [develop, staging]
    paths:
      - "app/**"
      - ".github/workflows/app-build-push.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    # environment drives which AWS_DEPLOY_ROLE_ARN variable is read.
    # GitHub Actions supports expressions here — evaluates before the job runs.
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'dev' }}
    permissions:
      id-token: write  # required for OIDC token exchange
      contents: read
    env:
      # Derived from the triggering branch so the same workflow file serves both
      # environments without duplication.
      ECR_REPOSITORY: ${{ github.ref_name == 'staging' && 'cvs-platform-staging' || 'cvs-platform' }}

    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # AWS_DEPLOY_ROLE_ARN is set as a variable on each GitHub Actions
          # environment (Settings > Environments > dev/staging > Variables).
          # Value: the github_actions_role_arn output from terraform apply.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}"

          # Build context is app/ (Dockerfile at app/Dockerfile).
          # The commit-SHA tag is the canonical production reference: IMMUTABLE on
          # ECR, so rolling back means pointing the ECS service at a previous SHA —
          # the image is guaranteed to be exactly what was built for that commit.
          docker build \
            --file app/Dockerfile \
            --tag "${IMAGE_URI}" \
            app/

          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${IMAGE_URI}"

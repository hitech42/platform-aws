services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: secretsmanager
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres is intentionally run natively (not in Docker) for local dev — this
  # enables IntelliJ IDEA debugger to attach to the app process without network
  # complications. See DECISIONS.md for the full rationale.
  #
  # Uncomment (or run with `--profile postgres`) if you need a fully containerised
  # setup, e.g. on a fresh machine or in CI without a native Postgres install.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   profiles:
  #     - postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: localdev
  #     POSTGRES_DB: platform
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U app -d platform"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  localstack_data:
  # postgres_data:

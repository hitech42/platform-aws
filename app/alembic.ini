[alembic]
# Path to migration scripts. %(here)s always resolves to this file's own
# directory regardless of the process's cwd — required because the ECS
# migration task's WORKDIR (/project) differs from the ini file's directory
# (/project/app/), whereas local dev runs `alembic` from app/ itself (cwd ==
# ini location), so a plain relative path only worked there by coincidence.
script_location = %(here)s/src/db/migrations

# Naming convention for generated migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend the alembic.ini directory to sys.path so env.py can locate the app.
prepend_sys_path = .
path_separator = os

version_path_separator = os

# Overridden at runtime by env.py (reads DATABASE_URL from app settings).
sqlalchemy.url = driver://placeholder/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

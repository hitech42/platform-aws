[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvs-platform-api"
version = "0.1.0"
description = "Developer Self-Service Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "boto3>=1.34.0",
    "structlog>=24.2.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3-stubs[secretsmanager]>=1.34.0",
    "sqlalchemy[mypy]>=2.0.30",
]

# Dependencies are installed; app code is imported via sys.path (project root).
# Run from the project root: `uvicorn app.src.main:app --reload`
[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI Depends() in function defaults is the canonical pattern
    "UP046", # PEP 695 generic syntax is py3.12+ but mypy plugin still prefers Generic[]
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
